<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GHOST Timeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One column: readout, map, slider, then the site card. The slider is the instrument; everything else is quiet. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --dim:#5a6878; --line:#cfd6de;
  --accent:#d9ff00; --marker:#454646; --ocean:#1b60b8; --sel:#18212b;
  --display:"Pixelify Sans","Courier New",monospace; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--panel:#18202a;--ink:#e6ebf0;--dim:#93a1b0;--line:#2c3744;--sel:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--panel:#18202a;--ink:#e6ebf0;--dim:#93a1b0;--line:#2c3744;--sel:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
main{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:grid;gap:2px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#epoch{font:700 clamp(28px,7vw,40px)/1.05 var(--display);margin:0;text-wrap:balance}
#ago{font:500 16px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
#period{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
#period i{width:10px;height:10px;border-radius:2px;display:inline-block}
figure{margin:0;display:grid;gap:6px}
#map{width:100%;max-width:100%;aspect-ratio:2/1;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
#map image{image-rendering:pixelated}
#map .hit{fill:transparent;cursor:pointer}
#map .site:focus{outline:none}
#map .site:focus-visible .ring,#map .site.on .ring{stroke:var(--sel)}
.ring{fill:none;stroke:transparent;stroke-width:.6}
.nomap{fill:var(--dim);font:600 5px var(--body);text-anchor:middle}
/* slider */
#track{position:relative;height:44px;touch-action:none;cursor:pointer;user-select:none;outline:none}
#bars{position:absolute;inset:10px 0 10px;display:flex;gap:2px}
.bar{flex:1;display:flex;border-radius:3px;overflow:hidden;min-width:0}
.slice{flex:1}
#thumb{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
#thumb::before{content:"";position:absolute;left:-1.5px;top:4px;bottom:4px;width:3px;background:var(--ink);border-radius:2px}
#thumb::after{content:"";position:absolute;left:-7px;top:0;width:14px;height:8px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
#track:focus-visible #thumb::before{box-shadow:0 0 0 3px var(--accent)}
#labels{display:flex;gap:2px;margin-top:-4px}
#labels span{flex:1;min-width:0;font:500 10px/1.2 var(--mono);color:var(--dim);text-align:center;overflow:hidden;white-space:nowrap}
/* site list + card */
#list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
#list button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
#list button[aria-pressed="true"]{border-color:var(--ink)}
#list i{width:8px;height:8px;background:var(--marker);display:inline-block;box-shadow:inset 0 0 0 2px var(--marker)}
#list i.lit{background:var(--accent)}
#card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
#card h2{font:700 20px/1.15 var(--display);margin:0}
#card .where{color:var(--dim);font-size:13px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
#card dt{color:var(--dim)}
#card dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font:600 14px var(--body);border-radius:6px;padding:7px 12px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btns button.ghost{background:transparent;color:var(--ink)}
.btns button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fauna{width:100%;border-collapse:collapse;font-size:14px}
.fauna th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 0;border-bottom:1px solid var(--line)}
.fauna th:not(:first-child),.fauna td:not(:first-child){padding-left:12px;text-align:right;font-variant-numeric:tabular-nums}
.fauna td{padding:6px 0;border-bottom:1px solid var(--line)}
.fauna label{display:flex;align-items:center;gap:8px;cursor:pointer}
.fauna tr.locked td{color:var(--dim)}
.rating{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-top:6px}
.rating select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:2px 4px}
#oracle{display:grid;gap:8px}
#oracle h2{font:700 18px/1.15 var(--display);margin:0}
#oracle p{margin:0;font-size:13px;color:var(--dim)}
.drones{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.drones li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.drones li.done{border-color:color-mix(in srgb, var(--ink) 35%, var(--line))}
.drones b{font-weight:600;font-size:14px}
.drones span{grid-column:1;font-size:13px;color:var(--dim)}
.drones button{grid-row:1 / span 2;grid-column:2;font:600 13px var(--body);border-radius:6px;padding:5px 10px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.drones button:disabled{background:transparent;color:var(--dim);border-color:var(--line);cursor:default}
#card h2 .badge{display:inline-block;vertical-align:middle;margin-left:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--accent);color:#18212b}
#list .done{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tag{white-space:nowrap;font:500 11px var(--mono);color:var(--dim)}
.report{background:color-mix(in srgb, var(--ink) 6%, var(--panel));border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.report h3{margin:0;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.report ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.report b{font:700 16px/1.2 var(--display)}
.report button{justify-self:start;font:600 13px var(--body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.empty{color:var(--dim);font-size:14px;margin:0}
#fleet{display:grid;gap:8px}
#fleet .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
#fleet h2{font:700 18px/1.15 var(--display);margin:0}
#fleet h2 .count{font:500 14px var(--mono);color:var(--dim);margin-left:6px;font-variant-numeric:tabular-nums}
#fleet .clock{display:flex;align-items:center;gap:8px;font:500 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
#fleet select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:2px 4px}
.ships{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ships li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:3px;font-size:13px;min-width:0}
.ships .top{display:flex;justify-content:space-between;gap:8px}
.ships b{font-size:14px;font-weight:600}
.ships .mk{font:500 11px var(--mono);color:var(--dim)}
.ships .st{color:var(--dim)}
.ships .bar2{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ships .bar2 i{display:block;height:100%;background:var(--accent)}
.ships .eta{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.ships li.free .st{color:var(--ink)}
#reports{display:grid;gap:6px}
.note{color:var(--dim);font-size:13px;margin:0}
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">GHOST · timeline test</span>
    <h1 id="epoch">Late Devonian</h1>
    <div id="ago">375 million years ago</div>
    <div id="period"><i></i><span></span></div>
    <label class="rating">Park rating (test) <select id="rating"></select></label>
  </header>

  <figure>
    <svg id="map" viewBox="0 0 130 65" role="img" aria-label="Map of the Earth"></svg>
  </figure>

  <div>
    <div id="track" role="slider" tabindex="0" aria-label="Time" aria-valuemin="0" aria-valuemax="1000">
      <div id="bars"></div>
      <div id="thumb"></div>
    </div>
    <div id="labels"></div>
  </div>

  <ul id="list" aria-label="Sites in view"></ul>
  <section id="card" aria-live="polite"></section>
  <section id="fleet" aria-label="GHOST drones"></section>
  <section id="oracle" aria-label="ORACLE upgrades"></section>
</main>

<script>
// Periods, oldest first. Each gets one equal bar; its epochs split the bar equally. Years are years ago.
const PERIODS = [
  {id:"Cambrian", color:"#7FA056", epochs:[["Early Cambrian",538.8e6],["Middle Cambrian",506.5e6],["Late Cambrian",497e6]]},
  {id:"Ordovician", color:"#009270", epochs:[["Early Ordovician",485.4e6],["Middle Ordovician",471.3e6],["Late Ordovician",458.2e6]]},
  {id:"Silurian", color:"#B3E1B6", epochs:[["Early Silurian",443.1e6],["Late Silurian",426.7e6]]},
  {id:"Devonian", color:"#C28A4D", epochs:[["Early Devonian",419.6e6],["Middle Devonian",393.3e6],["Late Devonian",382.7e6]]},
  {id:"Carboniferous", color:"#67A599", epochs:[["Mississippian",358.9e6],["Pennsylvanian",323.4e6]]},
  {id:"Permian", color:"#F04028", epochs:[["Cisuralian",298.9e6],["Guadalupian",273.0e6],["Lopingian",259.5e6]]},
  {id:"Triassic", color:"#812B92", epochs:[["Early Triassic",251.9e6],["Middle Triassic",246.7e6],["Late Triassic",237e6]]},
  {id:"Jurassic", color:"#34B2C9", epochs:[["Early Jurassic",201.4e6],["Middle Jurassic",174.7e6],["Late Jurassic",161.5e6]]},
  {id:"Cretaceous", color:"#7FC64E", epochs:[["Early Cretaceous",143.1e6],["Late Cretaceous",100.5e6]]},
  {id:"Paleogene", color:"#FD9A52", epochs:[["Paleocene",66.0e6],["Eocene",56.0e6],["Oligocene",33.9e6]]},
  {id:"Neogene", color:"#F2D32A", epochs:[["Miocene",23.03e6],["Pliocene",5.333e6]]},
  {id:"Quaternary", color:"#E8E27A", epochs:[["Pleistocene",2.58e6],["Holocene",11700]]},
];
const PRESENT = 10;   // the slider's floor: a log scale can't reach 0 years
// Flatten into epochs with both bounds: from (older) and to (younger).
const EPOCHS = [];
PERIODS.forEach((p, i) => p.epochs.forEach(([name, from], j) => {
  const next = p.epochs[j + 1] ? p.epochs[j + 1][1] : PERIODS[i + 1] ? PERIODS[i + 1].epochs[0][1] : PRESENT;
  EPOCHS.push({name, from, to:next, period:p, pi:i, ej:j});
}));

// Maps by period, 130 x 65 px. Sites put their dot on a map by pixel.
const MAPS = {Devonian:"maps/devonian.png"};
const SITES = [
  {id:"fram", name:"Fram Formation", where:"Ellesmere Island, Canada", from:378e6, to:372e6, at:{Devonian:[57, 39]}, fauna:[{name:"Tiktaalik", space:10, stars:.5}], trip:3500, days:1.5, risk:.10},
  {id:"britta", name:"Britta Dal Formation", where:"East Greenland", from:367e6, to:360e6, at:{Devonian:[63, 43]}, fauna:[{name:"Ichthyostega", space:8, stars:.5}], trip:3500, days:1.5, risk:.10},
];

// Survey Success for one animal at a site, the game's tripOdds: bigger animals are harder to find (TRIP.fail by TRIP_SIZE), plus the site's own risk.
const TRIP = {fail:[.1, .35], trips:[2, 8], spread:.35}, TRIP_SIZE = [10, 5000];
const sizeT = space => Math.min(Math.max(Math.log(space / TRIP_SIZE[0]) / Math.log(TRIP_SIZE[1] / TRIP_SIZE[0]), 0), 1);
const lerpT = ([a, b], t) => a + (b - a) * t;
// GHOST's survey drones: every park starts with Mk. I, and ORACLE researches Mk. II to V. Each cuts the chance a trip
// comes back empty by a share, so big, hard-to-find animals gain the most.
const DRONES = [
  {name:"GHOST Mk. I", points:0, cut:0},
  {name:"GHOST Mk. II", points:40, cut:.15},
  {name:"GHOST Mk. III", points:80, cut:.3},
  {name:"GHOST Mk. IV", points:140, cut:.4},
  {name:"GHOST Mk. V", points:220, cut:.5},
];
let drones = 1;   // the Mk. the park has
try { const d = parseInt(localStorage.getItem("ghost-timeline-mk")); if(d >= 1 && d <= DRONES.length) drones = d; } catch(e) {}
const droneCut = () => DRONES[drones - 1].cut;
// Scouting can fail: each animal not yet seen at the site has its own chance to turn up (big animals are easier to spot),
// drones cut the miss chance like they do for expeditions, and one trip turns up at most SCOUT.max of them.
const SCOUT = {find:[.35, .65], max:2};
const scoutChance = a => 1 - (1 - lerpT(SCOUT.find, sizeT(a.space))) * (1 - droneCut());
const success = (s, a) => 1 - Math.min(Math.max(lerpT(TRIP.fail, sizeT(a.space)) + s.risk, 0), .8) * (1 - droneCut());
// Genome % a successful find adds, as tripOdds: a genome takes 2 to 8 trips by size.
const findGain = (s, a) => 100 / Math.max(.6, lerpT(TRIP.trips, sizeT(a.space)) * success(s, a) - .5) * (1 - TRIP.spread + Math.random() * 2 * TRIP.spread);

// Slider position u (0 = oldest, 1 = today) to years ago and back: equal bars, equal slices, log scale inside a slice.
function yearsAt(u){
  u = Math.min(Math.max(u, 0), 1 - 1e-9);
  const pi = Math.floor(u * PERIODS.length), f = u * PERIODS.length - pi, n = PERIODS[pi].epochs.length;
  const ej = Math.floor(f * n), t = f * n - ej, e = EPOCHS.find(x => x.pi === pi && x.ej === ej);
  return {years:e.from * Math.pow(e.to / e.from, t), epoch:e};
}
function uAt(years){
  const e = EPOCHS.find(x => years <= x.from && years > x.to) || EPOCHS[EPOCHS.length - 1];
  const t = Math.log(years / e.from) / Math.log(e.to / e.from), n = e.period.epochs.length;
  return (e.pi + (e.ej + t) / n) / PERIODS.length;
}
// Bigger steps the further back: two significant figures under a million, then millions.
function fmtYearsAgo(y){
  if(y >= 1e7) return `${Math.round(y / 1e6)} million years ago`;
  if(y >= 1e6) return `${+(y / 1e6).toFixed(1)} million years ago`;
  const step = Math.pow(10, Math.max(1, Math.floor(Math.log10(y)) - 1)), r = Math.round(y / step) * step;
  return r >= 1e6 ? "1 million years ago" : `${r.toLocaleString("en-US")} years ago`;
}
const fmtMa = y => `${+(y / 1e6).toFixed(1)}`;

// A site shows for the whole of any epoch its window touches.
// Which sites GHOST has scouted is per viewer, a test convenience only.
// seen: site id -> the animals scouting has turned up there. A site is lit once it has been scouted at all.
let seen = {};
try { seen = JSON.parse(localStorage.getItem("ghost-timeline-seen") || "{}") || {}; } catch(e) {}
const saveSeen = () => { try { localStorage.setItem("ghost-timeline-seen", JSON.stringify(seen)); } catch(e) {} };
const isLit = id => !!seen[id];
const seenAt = s => s.fauna.filter(a => seen[s.id] && seen[s.id].includes(a.name));
const complete = s => isLit(s.id) && seenAt(s).length === s.fauna.length;
const known = name => Object.values(seen).some(l => l.includes(name));
let u = uAt(375e6), sel = null, target = null;

// The drone fleet. GHOST owns 1 to MAX_DRONES drones, all of the park's current Mk.; each flies one mission at a time.
// Missions run on a park clock in days (a game day is 240 s at 1x). A mission resolves when it gets back, and its
// post-mission overview waits in reports until it's dismissed.
const MAX_DRONES = 5, DAY_SECONDS = 240;
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e) { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
let fleet = Math.min(Math.max(load("ghost-timeline-fleet", 1), 1), MAX_DRONES);
let day = load("ghost-timeline-day", 1), speed = load("ghost-timeline-speed", 10);
let missions = load("ghost-timeline-missions", []), reports = load("ghost-timeline-reports", []);
const saveFleet = () => { keep("ghost-timeline-fleet", fleet); keep("ghost-timeline-missions", missions); keep("ghost-timeline-reports", reports); keep("ghost-timeline-day", day); };
const freeDrone = () => { for(let i = 0; i < fleet; i++) if(!missions.some(m => m.drone === i)) return i; return -1; };
const siteEpoch = s => EPOCHS.find(e => s.from <= e.from && s.from > e.to);
let rating = 1.5;
try { const r = parseFloat(localStorage.getItem("ghost-timeline-rating")); if(r >= 0 && r <= 5) rating = r; } catch(e) {}
const stars = n => `${n}★`;
const genome = load("ghost-timeline-genome", {});   // animal name -> % of its genome GHOST has

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
const shade = (hex, k) => `color-mix(in srgb, ${hex} ${k}%, ${k < 100 ? "black" : "white"})`;

function buildTrack(){
  $("bars").innerHTML = PERIODS.map(p => `<div class="bar" title="${p.id}">${p.epochs.map((e, j) =>
    `<div class="slice" style="background:${j % 2 ? shade(p.color, 80) : p.color}"></div>`).join("")}</div>`).join("");
  $("labels").innerHTML = PERIODS.map(p => `<span title="${p.id}">${p.id.slice(0, 3)}</span>`).join("");
}

function visibleSites(now){
  return SITES.filter(s => s.at[now.epoch.period.id] && s.from > now.epoch.to && s.to < now.epoch.from);
}

function render(){
  const now = yearsAt(u), e = now.epoch, p = e.period;
  $("epoch").textContent = e.name;
  $("ago").textContent = fmtYearsAgo(now.years);
  $("period").innerHTML = `<i style="background:${p.color}"></i><span>${esc(p.id)} · epoch ${fmtMa(e.from)} to ${e.to < 1e5 ? "today" : fmtMa(e.to) + " million years ago"}</span>`;
  $("thumb").style.left = (u * 100) + "%";
  const tr = $("track");
  tr.setAttribute("aria-valuenow", Math.round(u * 1000));
  tr.setAttribute("aria-valuetext", `${e.name}, ${fmtYearsAgo(now.years)}`);

  const map = MAPS[p.id], sites = visibleSites(now);
  let svg = map ? `<image href="${map}" x="0" y="0" width="130" height="65"/>`
    : `<ellipse cx="65" cy="32.5" rx="64" ry="31.5" fill="color-mix(in srgb, var(--dim) 18%, transparent)"/><text class="nomap" x="65" y="34">No ${esc(p.id)} map yet</text>`;
  if(map) for(const s of sites){
    const [x, y] = s.at[p.id], on = isLit(s.id);
    svg += `<g class="site${sel === s.id ? " on" : ""}" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(on ? s.name : "Unscouted site")}">
      <rect class="ring" x="${x - 2.5}" y="${y - 2.5}" width="5" height="5"/>
      <rect x="${x - 1}" y="${y - 1}" width="3" height="3" fill="var(--marker)"/>
      <rect x="${x}" y="${y}" width="1" height="1" fill="${on ? "var(--accent)" : "var(--marker)"}"/>
      <circle class="hit" cx="${x + .5}" cy="${y + .5}" r="6"/></g>`;
  }
  $("map").innerHTML = svg;

  if(sel && !sites.some(s => s.id === sel)) sel = null;
  $("list").innerHTML = sites.map(s => `<li><button data-id="${s.id}" aria-pressed="${sel === s.id}"><i class="${isLit(s.id) ? "lit" : ""}"></i>${esc(isLit(s.id) ? s.name : "Unscouted site, " + fmtMa(s.from) + " Ma")}${complete(s) ? ' <span class="done">Site Complete</span>' : ""}</button></li>`).join("");
  renderCard();
}

function renderCard(){
  const s = SITES.find(x => x.id === sel), c = $("card");
  if(!s){ c.innerHTML = `<p class="empty">Pick a site on the map to see what's there.</p>`; return; }
  const on = isLit(s.id), found = on ? seenAt(s) : [], hidden = s.fauna.length - found.length, win = `${fmtMa(s.from)} to ${fmtMa(s.to)} million years ago`;
  const trip = `$${s.trip.toLocaleString("en-US")} · ${s.days} days`, free = freeDrone(), rep = reports.find(r => r.site === s.id);
  const scouting = missions.some(m => m.site === s.id && m.kind === "scout"), hunting = target && missions.some(m => m.site === s.id && m.target === target);
  c.innerHTML = on ? `<h2>${esc(s.name)}${!hidden ? ' <span class="badge">Site Complete</span>' : ""}</h2><div class="where">${esc(s.where)}</div>
    <dl><dt>When</dt><dd>${win}</dd><dt>Trip</dt><dd>${trip}</dd></dl>
    <table class="fauna"><thead><tr><th>Target</th><th>Genome</th><th>Survey Success</th></tr></thead><tbody>${found.map(a => { const g = genome[a.name] || 0;
      const locked = rating < a.stars;
      return `<tr${locked ? ' class="locked"' : ""}><td><label><input type="radio" name="target" value="${esc(a.name)}"${target === a.name ? " checked" : ""}${g >= 100 || locked ? " disabled" : ""}> ${esc(a.name)}${locked ? ` <span class="tag">Needs ${stars(a.stars)}</span>` : ""}</label></td><td>${g}%</td><td>${Math.round(success(s, a) * 100)}%</td></tr>`; }).join("")}${Array.from({length:hidden}, () => `<tr class="locked"><td>Undiscovered species</td><td>?</td><td>?</td></tr>`).join("")}</tbody></table>
    ${rep ? reportHtml(rep) : ""}
    <div class="btns"><button id="go"${target && free >= 0 && !hunting ? "" : " disabled"}>${hunting ? "Already looking" : "Send expedition"}</button>${hidden ? `<button class="ghost" id="survey"${free >= 0 && !scouting ? "" : " disabled"}>${scouting ? "Scouting…" : "Send scouting trip"}</button>` : ""}<button class="ghost" id="forget">Forget scouting</button></div>
    ${free < 0 ? `<p class="note">All drones are out. One will be back in ${eta(Math.min(...missions.map(m => m.end)))}.</p>` : ""}`
  : `<h2>Unscouted site</h2><div class="where">Somewhere in the ${esc(EPOCHS.find(e => s.from <= e.from && s.from > e.to).name)}</div>
    <dl><dt>When</dt><dd>${win}</dd><dt>Animals</dt><dd>Scout Site First</dd><dt>Trip</dt><dd>${trip}</dd></dl>
    ${rep ? reportHtml(rep) : ""}
    <div class="btns"><button id="survey"${free >= 0 && !scouting ? "" : " disabled"}>${scouting ? "Scouting…" : "Send scouting trip"}</button></div>
    ${free < 0 ? `<p class="note">All drones are out. One will be back in ${eta(Math.min(...missions.map(m => m.end)))}.</p>` : ""}`;
}

function pick(id){ if(id !== sel) target = null; sel = id; render(); }
$("map").addEventListener("click", ev => { const g = ev.target.closest(".site"); if(g) pick(g.dataset.id); });
$("map").addEventListener("keydown", ev => { const g = ev.target.closest(".site"); if(g && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); pick(g.dataset.id); } });
$("list").addEventListener("click", ev => { const b = ev.target.closest("button"); if(b) pick(b.dataset.id); });
$("card").addEventListener("change", ev => { if(ev.target.name === "target"){ target = ev.target.value; renderCard(); } });
$("card").addEventListener("click", ev => {
  if(ev.target.id === "survey") send("scout", null);
  if(ev.target.id === "go") send("expedition", target);
  if(ev.target.classList.contains("dismiss")) dismiss(+ev.target.dataset.r);
  if(ev.target.id === "forget"){ delete seen[sel]; target = null; saveSeen(); render(); }
});

function send(kind, tgt){
  const s = SITES.find(x => x.id === sel), d = freeDrone();
  if(d < 0) return;
  missions.push({drone:d, site:s.id, kind, target:tgt, start:day, end:day + s.days});
  saveFleet(); render(); renderFleet();
}
function dismiss(id){ reports = reports.filter(r => r.id !== id); saveFleet(); renderCard(); renderFleet(); }
function reportHtml(r){
  return `<div class="report" role="status"><h3>${esc(r.title)}</h3><ul>${r.lines.map(l => `<li>${l}</li>`).join("")}</ul><button class="dismiss" data-r="${r.id}">Done</button></div>`;
}

// A mission resolves when its drone gets back.
function land(m){
  const s = SITES.find(x => x.id === m.site), who = `Drone ${m.drone + 1}`;
  let title, lines;
  // A scouting trip turns up some of the animals still unseen here; one no scouted site had before is discovered.
  if(m.kind === "scout"){
    const have = seenAt(s);
    const hits = s.fauna.filter(a => !have.includes(a) && Math.random() < scoutChance(a)).sort(() => Math.random() - .5).slice(0, SCOUT.max);
    lines = hits.map(a => known(a.name) ? `${esc(a.name)} also found here` : `<b>${esc(a.name)} Discovered</b>`);
    seen[s.id] = [...(seen[s.id] || []), ...hits.map(a => a.name)]; saveSeen();
    if(hits.length && complete(s)) lines.push("<b>Site Complete</b>");
    title = `Scouting report · ${s.name} · ${who}`;
  } else {
    const a = s.fauna.find(x => x.name === m.target);
    title = `Expedition report · ${s.name} · ${who}`;
    if(Math.random() < success(s, a)){
      const was = genome[a.name] || 0, now = Math.min(100, Math.round(was + findGain(s, a)));
      genome[a.name] = now; keep("ghost-timeline-genome", genome);
      lines = [`<b>${esc(a.name)} Sample Found</b>`, ...(now >= 100 ? [`<b>${esc(a.name)} Genome Complete</b>`] : [])];
      if(now >= 100 && target === a.name) target = null;
    }
  }
  reports.unshift({id:Math.max(0, ...reports.map(r => r.id)) + 1, site:s.id, title, lines:lines && lines.length ? lines : ["Came back empty handed"]});
}

// Dragging and keys. Arrows nudge, Page keys jump an epoch, Home and End go to the ends.
const tr = $("track");
const setFromX = x => { const r = tr.getBoundingClientRect(); u = Math.min(Math.max((x - r.left) / r.width, 0), 1); render(); };
tr.addEventListener("pointerdown", ev => { tr.setPointerCapture(ev.pointerId); tr.focus(); setFromX(ev.clientX); });
tr.addEventListener("pointermove", ev => { if(tr.hasPointerCapture(ev.pointerId)) setFromX(ev.clientX); });
tr.addEventListener("keydown", ev => {
  const e = yearsAt(u).epoch, i = EPOCHS.indexOf(e), slice = 1 / PERIODS.length / e.period.epochs.length;
  const jump = k => { const t = EPOCHS[Math.min(Math.max(i + k, 0), EPOCHS.length - 1)]; return (t.pi + (t.ej + .5) / t.period.epochs.length) / PERIODS.length; };
  const to = {ArrowLeft:u - slice / 20, ArrowDown:u - slice / 20, ArrowRight:u + slice / 20, ArrowUp:u + slice / 20,
    PageDown:jump(-1), PageUp:jump(1), Home:0, End:1}[ev.key];
  if(to === undefined) return;
  ev.preventDefault(); u = Math.min(Math.max(to, 0), 1); render();
});

$("rating").innerHTML = Array.from({length:11}, (_, i) => i / 2).map(n => `<option value="${n}"${n === rating ? " selected" : ""}>${stars(n)}</option>`).join("");
$("rating").addEventListener("change", ev => { rating = parseFloat(ev.target.value); try { localStorage.setItem("ghost-timeline-rating", rating); } catch(e) {}
  const s = SITES.find(x => x.id === sel), a = s && s.fauna.find(x => x.name === target); if(a && rating < a.stars) target = null; renderCard(); });
// ORACLE: drone upgrades, each needing the Mk. before it. Research is instant here.
function renderOracle(){
  $("oracle").innerHTML = `<h2>ORACLE · GHOST Drones</h2><p>Every park starts with GHOST Mk. I. Each upgrade cuts the chance a scouting trip or an expedition comes back empty handed.</p>
    <ul class="drones">${DRONES.map((d, i) => `<li class="${i < drones ? "done" : ""}"><b>${d.name}</b><span>${i ? `${Math.round(d.cut * 100)}% fewer empty-handed trips · ${d.points} research points` : "Standard drones"}</span>
      <button data-mark="${i + 1}"${i !== drones ? " disabled" : ""}>${!i ? "Standard" : i < drones ? "Researched" : i === drones ? "Research" : `Needs ${DRONES[i - 1].name.replace("GHOST ", "")}`}</button></li>`).join("")}</ul>
    ${drones > 1 ? `<div class="btns"><button class="ghost" id="dronesReset">Reset drones (test)</button></div>` : ""}`;
}
$("oracle").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if(!b) return;
  drones = b.id === "dronesReset" ? 1 : +b.dataset.mark;
  try { localStorage.setItem("ghost-timeline-mk", drones); } catch(e) {}
  renderOracle(); renderCard();
});
// Time left on the park clock: days, or clock hours under a day (a park day is 17 clock hours, 6 AM to 11 PM).
function eta(end){
  const d = Math.max(0, end - day);
  if(d >= 1) return `${+d.toFixed(1)} days`;
  const h = d * 17;
  return h >= 1 ? `${Math.round(h)} h` : `${Math.max(1, Math.round(h * 60))} min`;
}
function renderFleet(){
  const mk = DRONES[drones - 1].name.replace("GHOST ", "");
  const rows = Array.from({length:fleet}, (_, i) => {
    const m = missions.find(x => x.drone === i);
    if(!m) return `<li class="free"><div class="top"><b>Drone ${i + 1}</b><span class="mk">${mk}</span></div><div class="st">At GHOST, ready</div></li>`;
    const s = SITES.find(x => x.id === m.site), pct = Math.min(100, (day - m.start) / (m.end - m.start) * 100);
    return `<li><div class="top"><b>Drone ${i + 1}</b><span class="mk">${mk}</span></div>
      <div>${esc(isLit(s.id) ? s.name : "Unscouted site")} · ${esc(siteEpoch(s).name)}</div>
      <div class="st">${m.kind === "scout" ? "Scouting for animals" : `Looking for ${esc(m.target)}`}</div>
      <div class="bar2"><i style="width:${pct}%"></i></div><div class="eta">Back in ${eta(m.end)}</div></li>`;
  }).join("");
  $("fleet").innerHTML = `<div class="head"><h2>GHOST Drones <span class="count">${fleet} of ${MAX_DRONES}</span></h2>
      <label class="clock">Day ${Math.floor(day)} · Speed <select id="speed">${[[0, "Paused"], [1, "1×"], [10, "10×"], [60, "60×"]].map(([v, l]) => `<option value="${v}"${v === speed ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>
    <ul class="ships">${rows}</ul>
    ${fleet < MAX_DRONES ? `<div class="btns"><button class="ghost" id="addDrone">Add a drone (test)</button></div>` : ""}
    ${reports.length ? `<div id="reports">${reports.map(reportHtml).join("")}</div>` : ""}`;
}
$("fleet").addEventListener("change", ev => { if(ev.target.id === "speed"){ speed = +ev.target.value; keep("ghost-timeline-speed", speed); } });
$("fleet").addEventListener("click", ev => {
  if(ev.target.id === "addDrone" && fleet < MAX_DRONES){ fleet++; saveFleet(); renderFleet(); renderCard(); }
  if(ev.target.classList.contains("dismiss")) dismiss(+ev.target.dataset.r);
});

// The clock. Missions land as their end passes; the drone list redraws a few times a second while anything is out.
let last = performance.now(), drawn = 0;
function tick(t){
  const dt = Math.min(1, (t - last) / 1000); last = t;
  if(speed){
    day += dt * speed / DAY_SECONDS;
    const back = missions.filter(m => m.end <= day).sort((a, b) => a.end - b.end);
    if(back.length){ missions = missions.filter(m => m.end > day); back.forEach(land); saveFleet(); render(); renderFleet(); }
    else if(t - drawn > 250 && missions.length){ drawn = t; renderFleet(); keep("ghost-timeline-day", day); }
  }
  requestAnimationFrame(tick);
}
buildTrack(); render(); renderOracle(); renderFleet(); requestAnimationFrame(tick);
</script>
</body>
</html>
