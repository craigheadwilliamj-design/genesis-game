<title>Paleo-Park Tycoon v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#1d2419; --panel:#2b3524; --panel2:#35412c; --ink:#ecebdc; --muted:#a8ad94; --line:#4a573e; --accent:#d9a441; --bad:#e2624a; --good:#8fc46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  #hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #hud b { font-variant-numeric: tabular-nums; }
  #stage { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #side { position: absolute; top: 8px; right: 8px; width: 290px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  #side:empty { display: none; }
  #bell { position: absolute; left: 8px; top: 8px; width: 260px; max-width: calc(100% - 16px); max-height: 40%; overflow: auto; background: #2b3524e6; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #bell:empty, #bell[hidden] { display: none; }
  #bell div { padding: 2px 0; border-bottom: 1px solid #4a573e66; } #bell .urgent { color: var(--bad); }
  #tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); }
  button, select { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #1d2419; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #why { color: var(--bad); margin-left: 8px; min-height: 1em; }
  h3 { margin: 0 0 6px; font-size: 15px; } h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 2px 0; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; background: var(--panel2); margin: 2px 4px 2px 0; }
  .chip.bad { background: #5b2a22; color: #ffc9bd; } .chip.good { background: #2f4a25; color: #cfeab9; }
  .meter { flex: 1; height: 6px; background: #1d2419; border-radius: 3px; overflow: hidden; max-width: 120px; }
  .meter > i { display: block; height: 100%; background: var(--good); }
  .muted { color: var(--muted); }
</style>
<div id="app">
  <div id="hud"></div>
  <div id="stage"><canvas id="view"></canvas><div id="bell" hidden></div><div id="side"></div></div>
  <div id="tools"></div>
</div>
<script type="module" src="src/main.js"></script>
